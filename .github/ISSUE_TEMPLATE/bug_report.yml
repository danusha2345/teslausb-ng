name: Bug report
description: Report something that breaks on real Pi + Tesla hardware.
title: "[bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        **The maintainer of this fork does not own a Tesla or a Raspberry Pi to test on.**
        Every change ships behind CI (ShellCheck, Playwright smoke, path-traversal unit
        tests), but only your hardware report tells us whether the change actually works
        in the car. Please fill out every field below — incomplete reports usually sit
        untriaged because we cannot guess at the missing data.

        Before filing: skim the [v1.x release notes](https://github.com/danusha2345/teslausb-ng/releases)
        and the [ROADMAP](https://github.com/danusha2345/teslausb-ng/blob/main-dev/ROADMAP.md)
        in case the issue is already tracked.

  - type: input
    id: version
    attributes:
      label: teslausb-ng version
      description: "Output of `git -C /root/bin log -1 --format=%h` on the Pi, or the prebuilt image filename."
      placeholder: "e.g. 015a502 or teslausb-ng-1.0.0.img.xz"
    validations:
      required: true

  - type: dropdown
    id: pi_model
    attributes:
      label: Raspberry Pi (or SBC) model
      description: "From `cat /sys/firmware/devicetree/base/model`."
      options:
        - Raspberry Pi Zero W
        - Raspberry Pi Zero 2 W
        - Raspberry Pi 3 / 3B+
        - Raspberry Pi 4
        - Raspberry Pi 5
        - Rock Pi 4 / 4C plus
        - Radxa Zero
        - Other (please describe in "Additional information")
    validations:
      required: true

  - type: dropdown
    id: image
    attributes:
      label: OS image
      options:
        - teslausb-ng prebuilt image
        - marcone/teslausb prebuilt image (migrated)
        - Raspberry Pi OS Bookworm + manual setup
        - Armbian
        - Other
    validations:
      required: true

  - type: input
    id: tesla_model
    attributes:
      label: Tesla model + firmware version
      description: "Tesla rotates BLE/USB protocols between firmware versions. The firmware ID matters as much as the model."
      placeholder: "e.g. Model Y 2024 / firmware 2024.20.4"
    validations:
      required: true

  - type: dropdown
    id: usbconnection
    attributes:
      label: USB connection point
      options:
        - Center console
        - Glove box
        - Front USB (Model S/X)
    validations:
      required: true

  - type: dropdown
    id: archive_backend
    attributes:
      label: Archive backend
      description: "From `ARCHIVE_SYSTEM` in your teslausb_setup_variables.conf."
      options:
        - rsync
        - rclone
        - cifs
        - nfs
        - none
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What you expected to happen vs. what actually happened
      description: |
        Be concrete. "Sentry mode doesn't work" is harder to act on than
        "After v1.2.1, the BLE retry logs three attempts but the car never wakes;
        archiveloop continues normally afterwards."
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log slice
      description: |
        Paste from at least one of:
        - `journalctl -u teslausb -n 200`
        - `/mutable/archiveloop.log` (last ~200 lines)
        - `/mutable/archive-verbose.log` (if you set `ARCHIVE_VERBOSE=true`)
        - The web UI → Diagnostics tab → "Download diagnostics"
        Strip Wi-Fi passwords / Tesla tokens before pasting.
      render: text
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional information
      description: "Recurrence pattern, what you changed last, screenshots of the web UI, other things you've tried, etc."
    validations:
      required: false
