name: Build Image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      pi_gen_ref:
        description: "pi-gen branch/tag to build against"
        required: false
        default: "master"

permissions:
  contents: write

jobs:
  build:
    name: pi-gen image
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64,arm

      - name: Install qemu-user + binfmt support on the runner
        # pi-gen's build-docker.sh checks for `qemu-arm` (dynamic, from
        # qemu-user) — NOT `qemu-arm-static` — and bails with
        # "qemu-arm not found (please install qemu-user-binfmt)" if either
        # the binary or the binfmt registration is missing. Install the
        # full set and re-enable binfmts so binfmt_misc entries are live.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-user qemu-user-static qemu-user-binfmt binfmt-support
          sudo update-binfmts --enable || true
          # Re-register through tonistiigi/binfmt for good measure — this is
          # what docker/setup-qemu-action does but we want it after the apt
          # install above so the host /usr/bin/qemu-arm is in PATH.
          docker run --privileged --rm tonistiigi/binfmt --install all || true

      - name: Build image
        env:
          PI_GEN_CLEAN: "1"
        run: |
          tools/build-image.sh "${{ inputs.pi_gen_ref || 'master' }}"

      - name: Upload image artifacts
        uses: actions/upload-artifact@v4
        with:
          name: teslausb-ng-image
          path: deploy/*
          retention-days: 30

      - name: Attach image to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: deploy/*
          generate_release_notes: true
