name: Build Image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      pi_gen_ref:
        description: "pi-gen branch/tag to build against"
        required: false
        default: "master"

permissions:
  contents: write

jobs:
  build:
    name: pi-gen image
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64,arm

      - name: Build image
        env:
          PI_GEN_CLEAN: "1"
        run: |
          tools/build-image.sh "${{ inputs.pi_gen_ref || 'master' }}"

      - name: Upload image artifacts
        uses: actions/upload-artifact@v4
        with:
          name: teslausb-ng-image
          path: deploy/*
          retention-days: 30

      - name: Attach image to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: deploy/*
          generate_release_notes: true
