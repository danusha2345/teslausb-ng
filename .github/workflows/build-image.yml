name: Build Image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      pi_gen_ref:
        description: "pi-gen branch/tag to build against"
        required: false
        default: "master"

permissions:
  contents: write

jobs:
  build:
    name: pi-gen image
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64,arm

      - name: Install pi-gen native build dependencies
        # Native pi-gen (./build.sh) avoids the binfmt_misc-in-container
        # surface that breaks ./build-docker.sh. Pi-gen's depends file
        # insists on the literal qemu-user-binfmt package, which on
        # Ubuntu Noble conflicts with qemu-user-static (both provide
        # /usr/bin/qemu-arm). We need qemu-user-static's STATIC binary
        # (qemu-arm-static) because pi-gen's debootstrap copies that
        # into the chroot, so the only path that satisfies both checks
        # is: install qemu-user-static for the actual functionality,
        # then build and install a dummy qemu-user-binfmt via equivs so
        # dpkg reports it present and pi-gen's depends check passes.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            coreutils quilt parted qemu-user-static debootstrap \
            zerofree zip dosfstools libarchive-tools libcap2-bin \
            grep rsync xz-utils file git curl bc qemu-utils kpartx \
            gpg pigz arch-test equivs
          # Build a dummy qemu-user-binfmt package to satisfy pi-gen's
          # depends list. qemu-user-static provides the actual binfmt
          # registrations via update-binfmts.
          mkdir -p /tmp/equivs && cd /tmp/equivs
          cat > qemu-user-binfmt-stub.ctl <<'STUB'
          Section: misc
          Priority: optional
          Standards-Version: 3.9.2
          Package: qemu-user-binfmt
          Version: 99
          Maintainer: teslausb-ng CI <ci@example.com>
          Architecture: all
          Provides: qemu-user-binfmt
          Description: Dummy package satisfying pi-gen's qemu-user-binfmt requirement
           Functionality comes from qemu-user-static (installed in the same
           apt step). pi-gen's build.sh checks for the literal package name
           qemu-user-binfmt which conflicts with qemu-user-static on Ubuntu
           Noble. This stub makes dpkg-query report the package as installed.
          STUB
          equivs-build qemu-user-binfmt-stub.ctl
          sudo dpkg -i qemu-user-binfmt_99_all.deb
          cd "$GITHUB_WORKSPACE"
          # Make sure binfmt_misc handlers are live (they auto-register on
          # qemu-user-static install but enabling is a no-op safety net).
          sudo update-binfmts --enable || true
          arch-test armhf || true
          arch-test armel || true
          arch-test arm64 || true

      - name: Build image
        env:
          PI_GEN_CLEAN: "1"
        run: |
          tools/build-image.sh "${{ inputs.pi_gen_ref || 'master' }}"

      - name: Upload image artifacts
        uses: actions/upload-artifact@v4
        with:
          name: teslausb-ng-image
          path: deploy/*
          retention-days: 30

      - name: Attach image to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: deploy/*
          generate_release_notes: true
