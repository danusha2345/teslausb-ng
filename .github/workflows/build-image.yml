name: Build Image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      pi_gen_ref:
        description: "pi-gen branch/tag to build against"
        required: false
        default: "master"

permissions:
  contents: write

jobs:
  build:
    name: pi-gen image
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64,arm

      - name: Install pi-gen native build dependencies
        # Pi-gen's depends file uses the "tool:package" format. The relevant
        # entry is `qemu-arm:qemu-user-binfmt`, meaning pi-gen verifies the
        # presence of the qemu-arm binary (via `hash qemu-arm`) and only
        # suggests installing qemu-user-binfmt as a hint when the check
        # fails. The qemu-arm BINARY comes from qemu-user (NOT qemu-user-
        # binfmt nor qemu-user-static). qemu-user and qemu-user-static do
        # not conflict on Ubuntu Noble — only qemu-user-binfmt conflicts
        # with qemu-user-static. Install both: qemu-user satisfies
        # pi-gen's `hash qemu-arm` check; qemu-user-static provides the
        # qemu-arm-static binary that pi-gen's debootstrap step copies
        # into the chroot.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            coreutils quilt parted qemu-user qemu-user-static \
            debootstrap zerofree zip dosfstools libarchive-tools \
            libcap2-bin grep rsync xz-utils file git curl bc \
            qemu-utils kpartx gpg pigz arch-test xxd kmod
          sudo update-binfmts --enable || true
          # Sanity-check what pi-gen will check.
          hash qemu-arm && echo "qemu-arm: $(command -v qemu-arm)"
          hash qemu-arm-static && echo "qemu-arm-static: $(command -v qemu-arm-static)"
          arch-test armhf || true
          arch-test arm64 || true

      - name: Build image
        env:
          PI_GEN_CLEAN: "1"
        run: |
          tools/build-image.sh "${{ inputs.pi_gen_ref || 'master' }}"

      - name: Upload image artifacts
        uses: actions/upload-artifact@v4
        with:
          name: teslausb-ng-image
          path: deploy/*
          retention-days: 30

      - name: Attach image to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: deploy/*
          generate_release_notes: true
