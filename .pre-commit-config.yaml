---
# Pre-commit hooks for teslausb-ng.
# Install once with:
#   pip install pre-commit
#   pre-commit install
#
# The shellcheck hook mirrors the strict pass in check.sh. shfmt and
# prettier are advisory locally (and in CI) for now — flip exit code
# to fail once the existing tree is fully reformatted.
repos:
  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.10.0
    hooks:
      - id: shellcheck
        args: ["--exclude=SC1091"]

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.8.0-1
    hooks:
      - id: shfmt
        args: ["-d", "-i", "2", "-ci", "-sr"]

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        files: ^teslausb-www/html/.*\.(js|css|html)$
